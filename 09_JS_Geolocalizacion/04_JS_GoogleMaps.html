<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubicación en Google Maps</title>
    <style>
        body { font: 1rem/1.5 Arial, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        button, input { padding: .5rem; margin: .3rem; }
        #mapa { height: 420px; width: 100%; background: #eee; }
    </style>
</head>
<body>
    <h1>Ubicación en Google Maps</h1>
    <p>Configura una clave propia y carga la API. Después solicita tu posición para centrar el mapa.</p>
    <label for="clave">Clave propia de Google Maps:</label>
    <input id="clave" type="text" autocomplete="off" spellcheck="false">
    <button type="button" id="cargar">Cargar API de mapas</button>
    <button type="button" id="iniciar" disabled>Mostrar mi posición</button>
    <div id="mapa" aria-label="Mapa de ubicación"></div>
    <p id="mensaje" role="status"></p>
    <p id="coordenadas"></p>
    <script>
        const mensaje = document.getElementById('mensaje');
        const coordenadas = document.getElementById('coordenadas');

        function disponible() {
            if (!window.isSecureContext) {
                mensaje.textContent = 'Abre la página con HTTPS o en localhost.';
                return false;
            }
            if (!navigator.geolocation) {
                mensaje.textContent = 'La geolocalización no está disponible en este navegador.';
                return false;
            }
            return true;
        }

        function mostrarError(error) {
            switch (error.code) {
                case 1:
                    mensaje.textContent = 'No hay permiso para acceder a la ubicación. Revisa los permisos del sitio.';
                    break;
                case 2:
                    mensaje.textContent = 'No se ha podido determinar la posición.';
                    break;
                case 3:
                    mensaje.textContent = 'Se ha agotado el tiempo de espera. Puedes volver a intentarlo.';
                    break;
                default:
                    mensaje.textContent = 'Se ha producido un error al obtener la ubicación.';
            }
        }

        const cargar = document.getElementById('cargar');
        const iniciar = document.getElementById('iniciar');
        const clave = document.getElementById('clave');
        let mapa = null;
        let marcador = null;

        // El botón de ubicación se activa solo cuando Google termina de cargar.
        window.apiCargada = function () {
            iniciar.disabled = false;
            mensaje.textContent = 'API de mapas cargada. Ya puedes solicitar tu ubicación.';
        };
        window.gm_authFailure = function () {
            iniciar.disabled = true;
            mensaje.textContent = 'Google no ha autorizado el mapa. Revisa clave, restricciones y facturación y recarga.';
        };
        cargar.addEventListener('click', function () {
            if (!clave.value.trim()) {
                mensaje.textContent = 'Introduce una clave propia de Maps JavaScript API.';
                return;
            }
            cargar.disabled = true;
            mensaje.textContent = 'Cargando Google Maps…';
            const script = document.createElement('script');
            script.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(clave.value.trim()) +
                '&loading=async&callback=apiCargada&libraries=marker&v=weekly';
            script.async = true;
            script.onerror = function () {
                mensaje.textContent = 'No se ha podido descargar Google Maps. Revisa la conexión y recarga.';
            };
            document.head.appendChild(script);
        });

        function mostrarEnMapa(posicion) {
            const punto = { lat: posicion.coords.latitude, lng: posicion.coords.longitude };
            coordenadas.textContent = 'Latitud: ' + punto.lat + ' | Longitud: ' + punto.lng +
                ' | Precisión estimada: ' + Math.round(posicion.coords.accuracy) + ' metros.';
            // Creamos el mapa una sola vez; después actualizamos su centro y el marcador.
            if (mapa === null) {
                mapa = new google.maps.Map(document.getElementById('mapa'), {
                    center: punto,
                    zoom: 15,
                    mapId: 'DEMO_MAP_ID' // Identificador de demostración para practicar.
                });
                marcador = new google.maps.marker.AdvancedMarkerElement({
                    map: mapa,
                    position: punto,
                    title: 'Ubicación del dispositivo'
                });
            } else {
                mapa.setCenter(punto);
                marcador.position = punto;
            }
        }

        iniciar.addEventListener('click', function () {
            if (!disponible()) return;
            iniciar.disabled = true;
            coordenadas.textContent = '';
            mensaje.textContent = 'Esperando permiso o ubicación…';
            navigator.geolocation.getCurrentPosition(function (posicion) {
                iniciar.disabled = false;
                try {
                    mostrarEnMapa(posicion);
                    mensaje.textContent = 'Posición mostrada en el mapa.';
                } catch (error) {
                    mensaje.textContent = 'No se ha podido mostrar el mapa. Revisa la consola.';
                    console.error(error);
                }
            }, function (error) {
                iniciar.disabled = false;
                mostrarError(error);
            }, { timeout: 10000, maximumAge: 0 });
        });

    </script>
</body>
</html>
