<!DOCTYPE html>
<html lang="en">
    <head>
        <title>DOM - Document Object Model</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">        
        <!-- "solo la etiqueta" -> todas las etiqeutas
            "." clase 
            "#" id
            -->
        <style>
            .principal{
                color:blueviolet;
                font-weight: bold
            }
        </style>
        <script>
        // La teoría del DOM y el dibujo del árbol están en el README.md de esta carpeta.

    function cargar(){
        /*  ACCESO AL NODO MEDIANTE EL ID */
        // Devuelve un elemento, o null si no existe ese id.
        const cabecera = document.getElementById("cabecera");
        
        /* ACCESO AL NODO MEDIANTE ETIQUETAS  */
        // Devuelve una colección HTMLCollection con todos los elementos p.
        const parrafos = document.getElementsByTagName("p");
        //Aunque haya un solo elemento, sigue siendo una colección. Para acceder al primer elemento, usamos la posición 0.
        const primerParrafo = parrafos[0];

        for(const parrafo of parrafos) {
            // Podríamos consultar o modificar cada párrafo.
        }
        
        /* ACCESO A LOS NODOS MEDIANTE NAME */
        // Devuelve una colección NodeList con los elementos cuyo atributo name coincide.
        const listaNodosName = document.getElementsByName("parrafo1");
        const p1Name = listaNodosName[0]; // La posición 0 corresponde al primer elemento.

        /* ACCESO A LOS NODOS MEDIANTE NOMBRE DE CLASE */
        // Devuelve una colección HTMLCollection con los elementos de clase "principal".
        // Aunque solo haya uno, el resultado sigue siendo una colección.
        const principal = document.getElementsByClassName("principal")[0]; // La posición 0 corresponde al primer elemento.
        
        /* ACCESO AL NODO MEDIANTE EL SELECTOR CSS */
        // querySelector devuelve el primer elemento que coincide, o null si no hay ninguno.
        const primerPrincipal = document.querySelector(".principal");
        // querySelectorAll devuelve todos los coincidentes en una colección NodeList.
        // Si no hay coincidencias, devuelve una colección vacía.
        const principales = document.querySelectorAll(".principal");
        console.log("Primer elemento de clase principal:", primerPrincipal);
        console.log("Colección de elementos de clase principal:", principales);

        // Devuelve una colección NodeList con los elementos p de clase "parrafo2Clase".
        const p2Css = document.querySelectorAll("p.parrafo2Clase");
        
        /* ACCESO DIRECTO A LOS ATRIBUTOS HTML */
        const p1 = document.getElementById("parrafo1");
        console.log("Valores Parrafo1 de diferentes maneras")
        //Podemos acceder a sus atributos mediante el "."
        console.log(p1.id)
        // .style consulta los estilos escritos en el atributo style del HTML.
        console.log(p1.style.fontWeight);  // muestra "bold"
        console.log(p1.style.color);  // muestra "blue"

        //otras maneras de acceder a parrafo1
        console.log(primerParrafo.style.color);
        console.log(p1Name.style.color);
        console.log(principal);
        console.log(p2Css[0].style.color); //Rojo

        // El navegador permite acceder a elementos por su id.
        // Aquí enlace permite acceder al elemento con id="enlace".
        // Para código más grande es preferible guardar una referencia explícita:
        // const enlace = document.getElementById("enlace");
        console.log("Valores del enlace")
        console.log(enlace.title)
        console.log(enlace.href)
    }
        </script>
    </head>

    <!-- Esta funcion se ejecuta cuando se termine de cargar el body -->
    <body onload="cargar()">    

        <!-- Esto es un nodo comentario -->
        <div id="cabecera"> 
            <a href="http://www.google.es" id="enlace" title="A google que nos vamos!!">Google</a>
        </div>
    
        <p id="parrafo1" name="parrafo1" style="font-weight: bold;color: blue;">Parrafo 1</p>
        <p name="parrafo2" class="parrafo2Clase" style="color:red;">Parrafo 2</p>
        <p class="principal"> Parrafo 3 </p>

    </body>


</html>
