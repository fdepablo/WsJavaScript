<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
<script>
function modificar(){
    /* CREACIÓN DE NODO */

    // Crear nodo de tipo Element
    const parrafo = document.createElement("p");//<p></p>
    parrafo.id = "parrafo1" //<p id="parrafo1"></p>
    // Alternativa para establecer el mismo atributo mediante un método:
    // parrafo.setAttribute("id", "parrafo1");

    //Podemos alterar cualquier atributo
    parrafo.title = "Párrafo creado alterando el árbol DOM"; //<p id="parrafo1" title="Párrafo creado alterando el árbol DOM"></p>
    parrafo.name = "parrafo1" //<p id="parrafo1" title="Párrafo creado alterando el árbol DOM" name="parrafo1"></p>
    
    // Podemos asignar un nodo de texto al nodo Element, que se mostrará como contenido del párrafo.
    parrafo.textContent = "Párrafo creado alterando el árbol DOM"; 
    //<p id="parrafo1" title="Párrafo creado alterando el árbol DOM" name="parrafo1">Párrafo creado alterando el árbol DOM</p>

    // Alternativa: crear un nodo de texto y añadirlo como hijo del párrafo.
    // const contenido = document.createTextNode("Párrafo creado alterando el árbol DOM");
    // parrafo.appendChild(contenido);
    
    // Añadir el nodo Element como hijo de la pagina
    document.body.appendChild(parrafo);
    // Alternativa: añadirlo como hijo de un nodo concreto, por ejemplo el div con id="cabecera"
    // document.getElementById("cabecera").appendChild(parrafo);

    /* BORRADO DE NODO */
    // Eliminamos el enlace de la página, y todos sus hijos (si los tuviera).
    const enlace = document.getElementById("enlace");
    enlace.remove();
    // Podemos borrar toda la página, aunque no es recomendable.
    //document.body.remove();

    // Alternativa mediante su nodo padre:
    // parentNode obtiene el padre: en este HTML es el div con id="cabecera".
    // removeChild(enlace) le pide al padre que elimine ese hijo.
    // enlace.parentNode.removeChild(enlace);

    // El cambio se realiza una sola vez: el enlace ya no existe tras eliminarlo.
    document.getElementById("modificar").disabled = true;
    
}
</script>
</head>

<body>

    <button type="button" id="modificar" onclick="modificar()">Modificar página</button>

    <div id="cabecera"> 
        <p>Esto es un parrafo normalito :)</p>
        <!-- El siguiente enlace se borrará al pulsar Modificar página -->
        <a href="http://www.google.es" id="enlace" title="A google que nos vamos!!">Google</a>
        <!-- Esta sería la alternativa para añadir el párrafo como hijo del div -->
    </div>

    <!-- Aquí aparecerá la etiqueta 'p' que hemos creado alterando el DOM al pulsar el botón Modificar página -->
    <!-- <p id="parrafo1">Párrafo creado alterando el árbol DOM</p> -->
</body>


</html>
