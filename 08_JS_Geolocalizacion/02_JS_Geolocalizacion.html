<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocalización 2</title>
    <style>
        body { font: 1rem/1.5 Arial, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        button, input { padding: .5rem; margin: .3rem; }
        #mapa { height: 420px; width: 100%; background: #eee; }
    </style>
</head>
<body>
    <h1>Geolocalización 2</h1>
    <p>Distingue los errores de permiso, disponibilidad y tiempo de espera.</p>
    <button type="button" id="obtener">Obtener posición</button>
    <p id="mensaje" role="status"></p>
    <p id="coordenadas"></p>
    <script>
        const mensaje = document.getElementById('mensaje');
        const coordenadas = document.getElementById('coordenadas');

        const obtener = document.getElementById('obtener');

        function disponible() {
            if (!window.isSecureContext) {
                mensaje.textContent = 'Abre la página con HTTPS o en localhost.';
                return false;
            }
            if (!navigator.geolocation) {
                mensaje.textContent = 'La geolocalización no está disponible en este navegador.';
                return false;
            }
            return true;
        }

        function mostrarPosicion(posicion) {
            const latitud = posicion.coords.latitude;
            const longitud = posicion.coords.longitude;
            coordenadas.textContent = 'Latitud: ' + latitud + ' | Longitud: ' + longitud +
                ' | Precisión estimada: ' + Math.round(posicion.coords.accuracy) + ' metros.';
            mensaje.textContent = 'Posición recibida.';
        }

        function mostrarError(error) {
            switch (error.code) {
                case 1:
                    mensaje.textContent = 'No hay permiso para acceder a la ubicación. Revisa los permisos del sitio.';
                    break;
                case 2:
                    mensaje.textContent = 'No se ha podido determinar la posición.';
                    break;
                case 3:
                    mensaje.textContent = 'Se ha agotado el tiempo de espera. Puedes volver a intentarlo.';
                    break;
                default:
                    mensaje.textContent = 'Se ha producido un error al obtener la ubicación.';
            }
        }

        obtener.addEventListener('click', function () {
            if (!disponible()) return;

            obtener.disabled = true;
            coordenadas.textContent = '';
            mensaje.textContent = 'Esperando permiso o ubicación…';
            // El resultado llega más tarde a una de estas dos funciones.
            navigator.geolocation.getCurrentPosition(function (posicion) {
                obtener.disabled = false;
                mostrarPosicion(posicion);
            }, function (error) {
                obtener.disabled = false;
                mostrarError(error);
            }, { timeout: 10000 });
        });
    </script>
</body>
</html>
